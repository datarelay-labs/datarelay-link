name: native-runtime-assets
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust runtime toolchain and target
        run: |
          rustup toolchain install 1.75.0 --profile minimal --no-self-update
          rustup target add --toolchain 1.75.0 "${{ matrix.target }}"
      - name: Install Linux ARM64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Test and build target-bound runtime assets
        env:
          DRLINK_NATIVE_TARGET: ${{ matrix.target }}
          DRLINK_NATIVE_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || 'cc' }}
          DRLINK_NATIVE_STRIP: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-strip' || 'strip' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-gnu ]; then
            cargo +1.75.0 test --locked --manifest-path native/drlink-egress/Cargo.toml
            cargo +1.75.0 test --locked --manifest-path native/drlink-mcp-runtime/Cargo.toml
          fi
          scripts/build-native-runtime-assets.sh
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-gnu ]; then
            python3 tests/test-native-runtime-package-selection.py
            DRLINK_EGRESS_RUNTIME=rust \
              DRLINK_EGRESS_NATIVE_LIBRARY="$PWD/lib/native/${{ matrix.target }}/libdrlink_egress.so" \
              python3 tests/test-egress-rust-relay.py
            DRLINK_MCP_RUNTIME=rust \
              DRLINK_MCP_NATIVE_LIBRARY="$PWD/lib/native/${{ matrix.target }}/libdrlink_mcp_runtime.so" \
              python3 tests/test-mcp-rust-runtime.py
          fi
      - name: Upload Linux native runtime package
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: native-runtimes-${{ matrix.target }}
          path: lib/native/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
