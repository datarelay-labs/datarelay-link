name: lint
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      # Full history + tags required: scripts/check-release-governance.sh asserts
      # historical release tags (v2.1.0..v2.3.0). Default shallow/tagless checkout
      # falsely fails those immutable-tag presence checks (release-attest.yml pattern).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Version consistency
        run: ./scripts/check-version-consistency.sh
      - name: Release governance
        run: ./scripts/check-release-governance.sh
      - name: Install Full Suite OS Python deps
        # python3-acme is required by AUTO_ACME (lib/drlink_mcp_tls.py). Previously
        # masked on GHA because the suite failed earlier on the undeclared MCP SDK.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-acme
      - name: Provision pinned official MCP SDK
        # VERSION_POLICY: MCP is included and release-blocking; do not skip.
        run: |
          SDK_PY="$(./tests/ensure-mcp-sdk-venv.sh | tail -n 1)"
          if [[ ! -x "$SDK_PY" ]]; then
            echo "ERROR: MCP SDK python missing or not executable: $SDK_PY" >&2
            exit 1
          fi
          echo "DRLINK_MCP_SDK_PYTHON=$SDK_PY" >> "$GITHUB_ENV"
      - name: Stage exact private RC41 for trusted Foundation PR suite
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/drl3-ux-saved-admission-pfci'
        env:
          FOUNDATION_READ_TOKEN: ${{ secrets.FOUNDATION_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FOUNDATION_READ_TOKEN:-}" || exit 2
          umask 077
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' '@datarelay-labs:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${FOUNDATION_READ_TOKEN}' > "$scratch/.npmrc"
          export NPM_CONFIG_USERCONFIG="$scratch/.npmrc"
          python3 - <<'RC41'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('rc41', 'tools/verify-link-foundation-rc41.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert len(mod.PACKAGE_SHA256) == 10
          RC41
          for name in auth-ui foundation foundation-cli icons product-shell system-admin-ui system-contracts testkit tokens ui; do
            npm pack "@datarelay-labs/$name@0.1.0-rc.41" --ignore-scripts --fetch-retries=0 --pack-destination "$scratch" > "$scratch/result" 2> "$scratch/errors"
          done
          python3 - "$scratch" <<'RC41'
          import importlib.util, hashlib, pathlib, sys
          spec=importlib.util.spec_from_file_location('rc41','tools/verify-link-foundation-rc41.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          root=pathlib.Path(sys.argv[1]); dest=pathlib.Path('web/.foundation/packs')
          for name, digest in mod.PACKAGE_SHA256.items():
              f=root/f'datarelay-labs-{name}-{mod.VERSION}.tgz'
              assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==digest
              (dest/f.name).write_bytes(f.read_bytes())
          print('FOUNDATION_LINT_RC41_ARCHIVES=PASS_10_OF_10')
          RC41
      - name: Full local non-Docker suite
        run: ./tests/run-all.sh
      # Live distro containers cannot validate systemd unless PID 1 is systemd.
      # Package install + Bash/Python/CLI checks run in a separate matrix job.
      - name: Build standalone bundles
        if: github.event_name != 'pull_request'
        run: |
          ./scripts/build-bundles.sh
          git diff --exit-code dist/
      - name: SHA256SUMS
        if: github.event_name != 'pull_request'
        run: ./scripts/verify-sha256sums.sh
      # Same order as scripts/build-release-artifacts.sh: the SBOM is generated
      # after SHA256SUMS and verified against the checked-out commit.
      - name: SBOM binds to the checked-out commit
        if: github.event_name != 'pull_request'
        run: |
          python3 ./scripts/generate-sbom.py -o dist/sbom.spdx.json
          ./scripts/verify-sbom.sh

  portability-containers:
    if: github.event_name != 'pull_request'
    name: distro ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with tests/distro-images.txt (checked by tests/test-distro-matrix.sh).
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - rockylinux:8
          - rockylinux:9
          - almalinux:9
          - amazonlinux:2023
          - amazonlinux:2
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Container package and CLI portability
        run: ./tests/run-distro-matrix.sh --image ${{ matrix.image }}
        # Uses the same Docker invocation as local ./tests/run-distro-matrix.sh.
        # Does not start systemd. SYSTEMD_SMOKE remains NOT_TESTED.
