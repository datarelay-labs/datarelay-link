name: Engineering System

on:
  pull_request:
  pull_request_target:

permissions:
  contents: read

jobs:
  governance-floor:
    if: github.event_name == 'pull_request_target'
    uses: datarelay-labs/engineering-system/.github/workflows/governance-floor.yml@ef0b5560eb0880c232f3b360a5dea1f8f31b99c5
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  adoption-compliance:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/adoption-compliance.yml@ef0b5560eb0880c232f3b360a5dea1f8f31b99c5

  enforcement-reconcile:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/enforcement-check.yml@ef0b5560eb0880c232f3b360a5dea1f8f31b99c5
