name: Engineering System

on:
  pull_request:
  pull_request_target:

permissions:
  contents: read

jobs:
  governance-floor:
    if: github.event_name == 'pull_request_target'
    uses: datarelay-labs/engineering-system/.github/workflows/governance-floor.yml@bbab51923ec6a574108b28748e799225d63d04d0
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  adoption-compliance:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/adoption-compliance.yml@bbab51923ec6a574108b28748e799225d63d04d0

  enforcement-reconcile:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/enforcement-check.yml@bbab51923ec6a574108b28748e799225d63d04d0
