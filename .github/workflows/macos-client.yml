name: macos-client
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install pinned Rust runtime toolchain and target
        run: |
          rustup toolchain install 1.75.0 --profile minimal --no-self-update
          rustup target add --toolchain 1.75.0 "${{ matrix.target }}"
      - name: Test and build target-bound runtime assets
        env:
          DRLINK_NATIVE_TARGET: ${{ matrix.target }}
          DRLINK_NATIVE_LINKER: cc
          DRLINK_NATIVE_STRIP: strip
        run: |
          cargo +1.75.0 test --locked --manifest-path native/drlink-egress/Cargo.toml
          cargo +1.75.0 build --release --locked --manifest-path native/drlink-egress/Cargo.toml
          cargo +1.75.0 test --locked --manifest-path native/drlink-mcp-runtime/Cargo.toml
          cargo +1.75.0 build --release --locked --manifest-path native/drlink-mcp-runtime/Cargo.toml
          scripts/build-native-runtime-assets.sh
          python3 scripts/verify-native-runtime-assets.py
          python3 tests/test-native-runtime-package-selection.py
          DRLINK_EGRESS_RUNTIME=rust \
            DRLINK_EGRESS_NATIVE_LIBRARY="$PWD/lib/native/${{ matrix.target }}/libdrlink_egress.so" \
            python3 tests/test-egress-rust-relay.py
          DRLINK_MCP_RUNTIME=rust \
            DRLINK_MCP_NATIVE_LIBRARY="$PWD/lib/native/${{ matrix.target }}/libdrlink_mcp_runtime.so" \
            python3 tests/test-mcp-rust-runtime.py
      - name: Upload Linux native runtime package
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: native-runtimes-${{ matrix.target }}
          path: lib/native/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          for test in tests/test-macos-*.sh; do
            bash "$test"
          done
          bash tests/test-frpctl-pty-completion.sh
          bash tests/test-frp-compat-gate.sh
          bash scripts/check-public-metadata.sh

  apple-silicon:
    if: github.event_name != 'pull_request' || github.base_ref == 'feature/v2.4.0-final-product-closure' || (github.base_ref == 'main' && startsWith(github.head_ref, 'qualification/'))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install pinned Rust runtime toolchain
        run: rustup toolchain install 1.75.0 --profile minimal --no-self-update
      - name: Build target-bound Rust runtime package
        run: scripts/build-native-runtime-assets.sh
      - name: Verify target-bound runtime package discovery
        run: |
          python3 scripts/verify-native-runtime-assets.py
          python3 tests/test-native-runtime-package-selection.py
      - name: Build and exercise native MCP process lifecycle
        run: |
          cargo +1.75.0 test --locked --manifest-path native/drlink-mcp-runtime/Cargo.toml
          cargo +1.75.0 build --release --locked --manifest-path native/drlink-mcp-runtime/Cargo.toml
          export DRLINK_MCP_RUNTIME=rust
          export DRLINK_MCP_NATIVE_LIBRARY="$PWD/lib/native/aarch64-apple-darwin/libdrlink_mcp_runtime.dylib"
          python3 tests/test-mcp-rust-runtime.py
          DRLINK_EGRESS_RUNTIME=rust \
            DRLINK_EGRESS_NATIVE_LIBRARY="$PWD/lib/native/aarch64-apple-darwin/libdrlink_egress.dylib" \
            python3 tests/test-egress-rust-relay.py
      - name: Upload pinned native runtime package
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: native-runtimes-aarch64-apple-darwin
          path: lib/native/aarch64-apple-darwin/
          if-no-files-found: error
          retention-days: 14
      - name: Verify client port
        run: |
          # The native package built and exercised above is bound to this
          # checkout's HEAD. The committed dist closure is bound to the
          # previously committed source snapshot; restore only the tracked
          # package files before checking that deterministic closure.
          git restore --worktree --source=HEAD -- lib/native/aarch64-apple-darwin/
          test "$(uname -m)" = arm64
          for test in tests/test-macos-*.sh; do
            /bin/bash "$test"
          done
          /bin/bash tests/test-frpctl-pty-completion.sh
          # Verify the real macOS bash/curl/OpenSSL execution path, not only
          # Linux-based Darwin mocks in the portable compatibility job.
          python3 tests/test-zero-touch-entry-fields.py
          python3 tests/test-zero-touch-operator-command-bound.py
          # The Guided Server CLI is Linux Server-only; native macOS tests
          # verify Agent bootstrap and must not impersonate Server role.
          python3 tests/test-zero-touch-command-exit.py
          python3 scripts/build-bundles.py
          git diff --exit-code dist/
      - name: Verify pinned FRP binary
        run: |
          version=0.71.0
          archive="$RUNNER_TEMP/frp.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/fatedier/frp/releases/download/v${version}/frp_${version}_darwin_arm64.tar.gz"
          echo "45be02b186860d375ed49a8941ae9569628a54bf14e67fc36b29c98c99dabcc6  $archive" |
            shasum -a 256 -c -
