name: macos-client
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          for test in tests/test-macos-*.sh; do
            bash "$test"
          done
          bash tests/test-frpctl-pty-completion.sh
          bash tests/test-frp-compat-gate.sh
          bash scripts/check-public-metadata.sh

  apple-silicon:
    # Owner-requested native validation of DNS-free Zero-Touch on PR #225.
    # Preserve the existing bounded native-runner gate for unrelated PRs.
    if: github.event_name != 'pull_request' || github.base_ref == 'feature/v2.4.0-final-product-closure' || github.head_ref == 'fix/issue165-owner-seed-target-20261027'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify client port
        run: |
          test "$(uname -m)" = arm64
          for test in tests/test-macos-*.sh; do
            /bin/bash "$test"
          done
          /bin/bash tests/test-frpctl-pty-completion.sh
          # Verify the real macOS bash/curl/OpenSSL execution path, not only
          # Linux-based Darwin mocks in the portable compatibility job.
          python3 tests/test-zero-touch-operator-command-bound.py
          python3 tests/test-zero-touch-guided-preflight.py
          python3 tests/test-zero-touch-command-exit.py
          python3 scripts/build-bundles.py
          git diff --exit-code dist/
      - name: Verify pinned FRP binary
        run: |
          version=0.71.0
          archive="$RUNNER_TEMP/frp.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/fatedier/frp/releases/download/v${version}/frp_${version}_darwin_arm64.tar.gz"
          echo "45be02b186860d375ed49a8941ae9569628a54bf14e67fc36b29c98c99dabcc6  $archive" |
            shasum -a 256 -c -
