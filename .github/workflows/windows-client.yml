name: windows-client
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  windows-impact:
    name: Detect native Windows qualification scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          required=true
          if [[ "$EVENT_NAME" == pull_request && "$BASE_REF" != feature/v2.4.0-final-product-closure && "$HEAD_REF" != qualification/* ]]; then
            # The PR checkout is the synthetic merge commit. Compare with its
            # first parent so all changes introduced by the PR are included.
            # On ambiguous history, qualify instead of silently skipping.
            if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
              changed=$(git diff --name-only HEAD^1 HEAD)
              if ! grep -Eq '^(windows/|tests/windows/|scripts/build-bundles\.py$|\.github/workflows/windows-client\.yml$|VERSION$)' <<< "$changed"; then
                required=false
              fi
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

  windows-powershell51:
    needs: windows-impact
    if: needs.windows-impact.outputs.required == 'true'
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        # actions/setup-python@v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build Windows bootstrap artifact
        shell: bash
        run: |
          python3 tests/test-zero-touch-entry-fields.py
          python3 scripts/build-bundles.py
          test -f dist/bootstrap-client.ps1
      - name: Verify actual Zero-Touch entry HTTPS transport
        shell: powershell
        env:
          DRLINK_STAGE_TEST_POWERSHELL: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install 'cryptography>=42,<47'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test-zero-touch-windows-pin.py WindowsPinnedCaCommandTests.test_rendered_entry_private_tls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows client test suite
        shell: powershell
        run: |
          # StrictMode avoided: PS 5.1 lacks $IsWindows
          $ErrorActionPreference = 'Stop'
          & .\tests\windows\run-all.ps1
      - name: FRP binary smoke (download + hash + version)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # cryptography builds a real CA→leaf chain for the product pin path
          # (OpenSSL CLI is not present on windows-latest by default).
          & .\tests\windows\frp-binary-smoke.ps1

  windows-pwsh7:
    needs: windows-impact
    if: needs.windows-impact.outputs.required == 'true'
    name: Windows PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        # actions/setup-python@v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build Windows bootstrap artifact
        shell: bash
        run: |
          python3 tests/test-zero-touch-entry-fields.py
          python3 scripts/build-bundles.py
          test -f dist/bootstrap-client.ps1
      - name: Verify actual Zero-Touch entry HTTPS transport
        shell: pwsh
        env:
          DRLINK_STAGE_TEST_POWERSHELL: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install 'cryptography>=42,<47'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test-zero-touch-windows-pin.py WindowsPinnedCaCommandTests.test_rendered_entry_private_tls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows client test suite
        shell: pwsh
        run: |
          # StrictMode avoided: PS 5.1 lacks $IsWindows
          $ErrorActionPreference = 'Stop'
          & .\tests\windows\run-all.ps1

  linux-pwsh-cross:
    name: Linux pwsh cross-language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install PowerShell
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            curl -fsSL -o /tmp/packages-microsoft-prod.deb \
              https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update -qq
            sudo apt-get install -y powershell
          fi
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion'
      - name: Run Windows suite under Linux pwsh
        run: pwsh -NoProfile -File tests/windows/run-all.ps1
