version: 1

setup_command: ""

paths:
  "server/**":
    domains:
      - "server"
  "client/**":
    domains:
      - "client"
  "lib/**":
    domains:
      - "shared"
  "web/**":
    domains:
      - "shared"
      - "server"
  "docs/PF9_STAGED_WEB_LOGIN.md":
    domains:
      - "shared"
  "install-web.sh":
    domains:
      - "server"
      - "shared"
  "uninstall-web.sh":
    domains:
      - "server"
      - "shared"
  "docs/PF9_FOUNDATION_WEB_TOTP_ADOPTION.md":
    domains:
      - "shared"
  "tests/**":
    domains:
      - "shared"

scenarios:
  - id: ADOPTED-TEST-001
    name: Project-native affected tests
    level: integration
    domains:
      - "server"
      - "client"
      - "shared"
    triggers:
      - affected
    cost: medium
    estimated_seconds: 420
    timeout_seconds: 900
    platforms:
      - "linux"
    command: "bash tests/run-all.sh"
    invariants:
      - "project-native tests remain green for affected changes"
    release_gate: true

  - id: DRLINK-PF9-SHARED-TOTP-WHEEL
    name: DRLink Web uses reviewed Foundation TOTP wheel
    level: unit
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 30
    agent_default: true
    domains:
      - "shared"
      - "server"
    triggers:
      - affected
      - pr
      - preflight
    platforms:
      - "linux"
    command: "python3 tests/test-v30-foundation-totp-wheel.py -q && python3 tests/test-v30-web-bundle.py -q"
    invariants:
      - "exact reviewed Foundation wheel SHA256 and source identity, no duplicate TOTP algorithm"
      - "optional Web package and uninstall own the wheel and verifier, Core 2.4 remains independent"
      - "existing TOTP sign-in, replay, recovery and enrollment backend remain product-owned"
    release_gate: true

  - id: DRLINK-PF9-STAGED-WEB-LOGIN
    name: DRLink Web 2-step password then OTP with no pre-MFA session
    level: integration
    cost: medium
    estimated_seconds: 115
    timeout_seconds: 300
    agent_default: true
    domains:
      - "shared"
      - "server"
    triggers:
      - affected
      - pr
      - preflight
    platforms:
      - "linux"
    command: "python3 tests/test-v30-web-password-otp.py -q && python3 tests/test-v30-web-staged-login-ui.py -q && python3 tests/test-v30-web-service.py V30WebServiceTests.test_staged_login_http_requires_otp_before_cookie V30WebServiceTests.test_staged_login_cancel_and_bad_password_are_unprivileged V30WebServiceTests.test_staged_login_source_agent_binding_and_default_off_session -q"
    invariants:
      - "password proof for enrolled MFA issues only a short-lived non-session challenge"
      - "current operator state, source agent, factor and replay must pass before session/cookie"
      - "invalid OTP does not reset per-account MFA throttle"
      - "global and per-account pre-auth quotas never evict unrelated unexpired challenges"
      - "MFA enrollment capacity rejects newcomers without evicting other users and allows a same-user refresh"
      - "Web login screen moves OTP to a separate second stage with no persisted credential"
    release_gate: true

  - id: DRLINK-PF9-WEB-MANAGEMENT-INGRESS
    name: DRLink Web/API management source ACL through verified Foundation policy
    level: integration
    cost: medium
    estimated_seconds: 50
    timeout_seconds: 180
    agent_default: true
    domains:
      - "server"
      - "shared"
    triggers:
      - affected
      - pr
      - preflight
    platforms:
      - "linux"
    command: "python3 tests/test-v30-web-management-ingress.py -q && python3 tests/test-v30-web-management-ingress-config.py -q && python3 tests/test-v30-web-acl-preflight.py -q && python3 tests/test-v30-web-service.py V30WebServiceTests.test_admin_management_ingress_status_is_read_only_and_role_guarded -q && python3 tests/test-v30-web-management-ingress-ui.py -q"
    invariants:
      - "read-only System panel for current Admin reflects live Web policy; failed status remains unavailable"
      - "no policy write/activation or SSH host access claims in Web status display"
      - "current authenticated Administrator sees read-only effective Web ingress status; anonymous and Read Only denied"
      - "status never exposes policy file bytes, raw source CIDRs, or live SSH apply claims"
      - "optional host-admin-selected owner-private ACL file enables strict versioned Web policy with no live mutation"
      - "unavailable, symlinked, world/group exposed, duplicate-key or oversized files fail startup closed"
      - "every ancestor directory uses no-follow FDs; ambiguous literal path and modified in-flight bytes fail closed"
      - "offline source simulation uses the single pinned shared Foundation ACL engine; never authorizes host/SSH access or rollout"
      - "CLI omits private source/proxy/path data and never returns policy-activation success"
      - "default-OFF policy preserves pre-existing login, health and static UI"
      - "explicit unavailable or enabled-denied source blocks static, login and management API before auth"
      - "untrusted/ambiguous forwarded chains cannot bypass pinned source ACL"
      - "no SSH host ACL or policy application without separate authorization"
    release_gate: true

  - id: DRLINK-PF12A-NONSECRET-CONFIG-HISTORY
    name: Link native safe configuration category history and blocked rollback preview
    level: integration
    cost: medium
    estimated_seconds: 65
    timeout_seconds: 240
    agent_default: true
    domains:
      - "server"
      - "shared"
    triggers:
      - affected
      - pr
      - preflight
    platforms:
      - "linux"
    command: "python3 tests/test-v30-web-config-history.py -q && python3 tests/test-v30-web-service.py V30WebServiceTests.test_pf12a_admin_only_config_history_is_count_only_and_never_rolls_back -q && python3 tests/test-v30-web-config-history-ui.py -q"
    invariants:
      - "product-owned SQLite revision snapshots are read with read-only Core authority only"
      - "only bounded allowlisted category counts enter pinned Foundation diff_configurations"
      - "actor, hostname, IP, token, object names and raw ConfigurationBundle never leave API"
      - "count equality is NOT semantic equivalence and fingerprints cover only count projections"
      - "rollback preview remains blocked without independent Admin/MFA/backup/recovery/audit authority"
      - "current Admin only GET; anonymous and Read Only denied before database access"
      - "legacy/malformed/duplicate-key YAML or unavailable snapshots fail closed with generic errors"
      - "Web package optional install/remove does not alter Core state, credentials or policy"
    release_gate: true

  - id: DRLINK-CLI-FEATURE-SCENARIO-RELEASE
    name: CLI feature/operator workflow reconciliation evidence validation
    level: static
    domains:
      - "server"
      - "client"
      - "shared"
    triggers:
      - release
    platforms:
      - "linux"
    command: "python3 scripts/check-pre-release-exhaustive-gates.py --gate cli-feature-scenario"
    invariants:
      - "completed product-surface reconciliation evidence is bound to the exact release HEAD"
      - "all release-blocking reconciliation counters are zero"
      - "the reconciliation is runtime non-destructive and validates Direct + AI-assisted operator-workflow coherence"
      - "every applicable feature and FCS has 100% Direct-user and AI-assisted persona coverage"
      - "scripted/harness execution is supplemental evidence and never substitutes for a user-role lane"
      - "independent reconciliation lanes use maximum-safe parallel execution with no avoidable serial wait"
      - "release-gate evidence requires exact Server and Agent runtime source identity, actual-user TTY persona coverage, and no tooling blockers"
      - "FCS/finding summaries are derived from retained ledgers and must match release JSON and final GitHub report"
      - "stale runtime observations are correlation-only and cannot be promoted to current-candidate defects"
      - "this validator does not provision or execute Server/Agent lifecycle qualification"
    release_gate: true

  - id: DRLINK-FULL-USER-E2E-RELEASE
    name: Full User E2E double-pass evidence
    level: e2e
    domains:
      - "server"
      - "client"
      - "shared"
    triggers:
      - release
    platforms:
      - "linux"
    command: "python3 scripts/check-pre-release-exhaustive-gates.py --gate full-user-e2e-all"
    invariants:
      - "FULL_USER_E2E PASS1 and PASS2 both passed on the exact release HEAD"
      - "all participating installed Server/Agent runtimes match the pinned product source HEAD"
      - "no mandatory scenario, public command, or required AI-assisted mirror is unexercised"
      - "persona-led public UX is primary evidence; wrapper/harness output is supplemental only"
      - "TTY-dependent persona coverage is complete and tooling blockers are zero"
      - "scenario/finding summaries are derived from retained ledgers and match the release JSON and final GitHub report"
    release_gate: true

  - id: ADOPTED-STATIC-001
    name: Git whitespace validation
    level: static
    domains:
      - "server"
      - "client"
      - "shared"
    triggers:
      - pr
      - preflight
      - release
    platforms:
      - "linux"
    command: "bash -lc 'if [ -n \"${ENGINEERING_BASE_REF:-}\" ]; then git diff --check \"${ENGINEERING_BASE_REF}...HEAD\"; elif git rev-parse --verify --quiet origin/main >/dev/null; then git diff --check origin/main...HEAD; elif git rev-parse --verify --quiet main >/dev/null; then git diff --check main...HEAD; elif git rev-parse --verify --quiet HEAD^ >/dev/null; then git diff --check HEAD^...HEAD; else git diff --check; fi'"
    invariants:
      - "committed candidate/base diff has no whitespace errors"
    release_gate: true
