version: 1
exact_head_required: true
artifact_hash_required: true
provenance_required: true
sbom_required: true
setup_command: ''
preflight_required: true
preflight_command: python3 scripts/check-pre-release-exhaustive-gates.py --gate all
qualification_command: bash -lc 'tests/run-all.sh && scripts/check-release-governance.sh'
artifact_hash_command: bash scripts/verify-sha256sums.sh
provenance_command: python3 scripts/sync-release-manifest-provenance.py --check
sbom_command: bash -lc 'python3 scripts/generate-sbom.py -o dist/sbom.spdx.json && bash scripts/verify-sbom.sh'
operational_e2e_required: true
operational_e2e_command: bash tests/run-release-qualification-pass.sh
full_e2e_passes: 2
public_smoke_required: true
public_smoke_command: bash -lc 'out=$(bash tests/live-distro-smoke.sh); rc=$?; printf
  "%s\n" "$out"; test "$rc" -eq 0 && ! grep -q "^FAIL" <<<"$out" && ! grep -q "^HOST_ROLE=uninstalled$"
  <<<"$out"'
blockers:
  p0: true
  p1: true
  user_blocking_p2: true
execution_context: github-hosted
human_equivalent_user_tests_required: true
human_equivalent_user_tests:
  contract_version: 2
  executor: EXECUTION_PROFILE
  direct_persona_execution_required: true
  canonical_contract_read_before_execution_required: true
  complete_rerun_after_remediation_required: true
  wrapper_user_substitution_forbidden: true
  contract_review_attestation_version: 1
  actual_user_surface_required: true
  primary_user_surface: cli
  actual_browser_process_required: false
  same_candidate_required: true
  finding_accumulation_before_remediation: true
  same_head_quality_closure_required: true
  candidate_freeze_after_quality_closure: true
  ci_contract_validation_only: true
  evidence_validator: tools/user_acceptance_contract.py
  surface_reconciliation:
    mandatory: true
    contract: docs/CLI_FEATURE_SCENARIO_RECONCILIATION.md
    minimum_passes: 1
  full_user_e2e:
    mandatory: true
    contract: docs/FULL_USER_E2E_SCENARIOS.md
    minimum_passes: 1

